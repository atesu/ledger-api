spring.application.name=ledger-api




spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ledger}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}

spring.datasource.username=${DB_USERNAME:ledger}
spring.datasource.password=${DB_PASSWORD:ledger}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true


spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.dynamic=true
ledger.settlement.eur-account-id=00000000-0000-0000-0000-000000000001
ledger.settlement.usd-account-id=00000000-0000-0000-0000-000000000002
ledger.settlement.jpy-account-id=00000000-0000-0000-0000-000000000003