services:
  ledger-api:
    build: .
    image: ledger-api:latest
    container_name: ledger-api
    ports:
      - "8081:8080"
    environment:
      DB_URL: "jdbc:mysql://host.docker.internal:3306/ledger"
      DB_USERNAME: ledger
      DB_PASSWORD: ledger
      RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
    depends_on:
      - rabbitmq
  rabbitmq:
    image: rabbitmq:4-management
    container_name: ledger-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
